<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="styles.css">
<style>
  body { margin: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mise-input::placeholder { color: var(--muted); }
  .mise-input:focus { border-color: var(--accent-line) !important; }
</style>
</helmet>
<div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px; background: var(--paper); font-family: var(--font-ui); -webkit-font-smoothing: antialiased; box-sizing: border-box;" data-palette="{{ palette }}" data-mode="{{ mode }}">
  <div data-screen-label="Account creation" style="width: 100%; max-width: 980px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); box-shadow: var(--shadow-2); overflow: hidden; display: grid; grid-template-columns: 0.82fr 1.18fr;">

    <!-- BRAND PANEL -->
    <div style="background: var(--accent); color: var(--on-accent); padding: 40px 38px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px;">
      <span style="font-family: var(--font-display); font-weight: 560; font-size: 27px; letter-spacing: -.01em;">Mise</span>
      <div>
        <span style="font-family: var(--font-mono); font-size: 11px; letter-spacing: .16em; opacity: .85;">{{ brandTag }}</span>
        <h2 style="font-family: var(--font-display); font-weight: 400; font-size: 38px; line-height: 1.06; letter-spacing: -.015em; margin: 14px 0 16px;">{{ brandH1 }}<br>{{ brandH2 }}</h2>
        <p style="margin: 0; font-size: 15px; line-height: 1.6; opacity: .9; max-width: 300px;">{{ brandCopy }}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 13px;">
        <sc-for list="{{ perks }}" as="perk" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 11px;">
            <span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.18); display: flex; align-items: center; justify-content: center;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
            </span>
            <span style="font-size: 13.5px; opacity: .94;">{{ perk }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- FORM PANEL -->
    <div style="padding: 44px 46px; display: flex; flex-direction: column;">
      <h1 style="font-family: var(--font-display); font-weight: 500; font-size: 27px; letter-spacing: -.01em; color: var(--ink); margin: 0 0 6px;">{{ heading }}</h1>
      <p style="margin: 0 0 26px; font-size: 14.5px; color: var(--ink-2);">{{ subhead }}</p>

      <sc-if value="{{ showSocial }}" hint-placeholder-val="{{ true }}">
        <button onClick="{{ noop }}" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 11px; padding: 13px 18px; border-radius: var(--radius-pill); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-family: var(--font-ui); font-size: 15px; font-weight: 600; cursor: pointer;" style-hover="background: var(--surface-2);">
          <svg width="17" height="17" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.2 35.5 24 35.5c-6.4 0-11.5-5.1-11.5-11.5S17.6 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.6 6.2 29.1 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5c10.7 0 19.5-8.7 19.5-19.5 0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.8 14.7l6.6 4.8C15.2 15.1 19.2 12.5 24 12.5c2.9 0 5.6 1.1 7.6 2.9l5.7-5.7C33.6 6.2 29.1 4.5 24 4.5c-7.3 0-13.7 4.1-16.9 10.2z"/><path fill="#4CAF50" d="M24 43.5c5.1 0 9.5-1.7 12.9-4.6l-6.2-5c-1.9 1.4-4.3 2.1-6.7 2.1-5.2 0-9.6-3.1-11.3-7.5l-6.5 5C9.4 39.3 16 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.2 5c-.4.4 6.7-4.9 6.7-14.5 0-1.2-.1-2.3-.4-3.5z"/></svg>
          Continue with Google
        </button>
        <div style="display: flex; align-items: center; gap: 14px; margin: 22px 0;">
          <span style="flex: 1; height: 1px; background: var(--line);"></span>
          <span style="font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em; color: var(--muted);">{{ dividerLabel }}</span>
          <span style="flex: 1; height: 1px; background: var(--line);"></span>
        </div>
      </sc-if>

      <!-- EMAIL -->
      <label style="font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px; display: block;">EMAIL</label>
      <input class="mise-input" type="email" autocomplete="email" placeholder="you@example.com" value="{{ email }}" onInput="{{ onEmail }}" onKeyDown="{{ onKey }}" style="width: 100%; padding: 13px 16px; border: 1px solid {{ emailBorder }}; border-radius: var(--radius-md); background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; outline: none; box-sizing: border-box; transition: border-color 120ms ease;">
      <div style="min-height: 18px; margin-top: 6px;"><span style="font-size: 12.5px; color: var(--accent);">{{ emailError }}</span></div>

      <!-- PASSWORD -->
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin: 8px 0 8px;">
        <label style="font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--muted);">PASSWORD</label>
        <button onClick="{{ togglePw }}" style="border: none; background: none; padding: 0; cursor: pointer; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em; color: var(--ink-2);">{{ pwToggleLabel }}</button>
      </div>
      <input class="mise-input" type="{{ pwType }}" autocomplete="{{ pwAutocomplete }}" placeholder="{{ pwPlaceholder }}" value="{{ password }}" onInput="{{ onPassword }}" onKeyDown="{{ onKey }}" style="width: 100%; padding: 13px 16px; border: 1px solid {{ pwBorder }}; border-radius: var(--radius-md); background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; outline: none; box-sizing: border-box; transition: border-color 120ms ease;">
      <div style="min-height: 18px; margin-top: 6px; display: flex; justify-content: space-between; gap: 12px;">
        <span style="font-size: 12.5px; color: {{ pwHintColor }};">{{ pwHint }}</span>
        <span style="font-size: 12.5px; color: var(--accent); font-weight: 600; cursor: pointer; white-space: nowrap;">{{ forgotLabel }}</span>
      </div>

      <!-- SUBMIT -->
      <button onClick="{{ onSubmit }}" disabled="{{ submitDisabled }}" style="width: 100%; margin-top: 18px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; padding: 15px 22px; border-radius: var(--radius-pill); border: 1px solid transparent; background: {{ submitBg }}; color: {{ submitColor }}; box-shadow: {{ submitShadow }}; font-family: var(--font-ui); font-size: 15px; font-weight: 600; cursor: {{ submitCursor }}; transition: background 120ms ease;">
        <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
          <span style="width: 15px; height: 15px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 999px; display: inline-block; animation: spin .7s linear infinite;"></span>
        </sc-if>
        {{ submitLabel }}
      </button>

      <p style="margin: 14px 0 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); text-align: center;">{{ legalCopy }}</p>

      <div style="margin-top: auto; padding-top: 26px; text-align: center; font-size: 13.5px; color: var(--muted);">
        {{ switchPrompt }} <span onClick="{{ switchMode }}" style="color: var(--accent); font-weight: 600; cursor: pointer;">{{ switchAction }}</span>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1040, &quot;height&quot;: 680}, &quot;palette&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;ember&quot;, &quot;options&quot;: [&quot;ember&quot;, &quot;saffron&quot;, &quot;basil&quot;, &quot;harissa&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;}, &quot;mode&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;light&quot;, &quot;options&quot;: [&quot;light&quot;, &quot;dark&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Theme&quot;}, &quot;showSocial&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Options&quot;}}">
class Component extends DCLogic {
  state = { mode: 'signin', email: '', password: '', showPw: false, touched: false, loading: false };

  validEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  renderVals() {
    const { mode, email, password, showPw, touched, loading } = this.state;
    const signup = mode === 'signup';
    const emailOk = this.validEmail(email);
    const pwOk = signup ? password.length >= 8 : password.length > 0;

    const setMode = (m) => this.setState({ mode: m, touched: false, loading: false, password: '' });

    const submit = () => {
      this.setState({ touched: true });
      if (!emailOk || !pwOk) return;
      this.setState({ loading: true });
      setTimeout(() => this.setState({ loading: false }), 1100);
    };

    const emailError = (touched && !emailOk && email.length > 0) ? 'Enter a valid email address.' : '';
    const pwTooShort = signup && touched && password.length > 0 && password.length < 8;

    const accent = 'var(--accent)';
    const canSubmit = emailOk && pwOk && !loading;

    return {
      palette: this.props.palette ?? 'ember',
      mode: this.props.mode ?? 'light',
      showSocial: this.props.showSocial ?? true,

      brandTag: signup ? 'JOIN MISE' : 'WELCOME BACK',
      brandH1: signup ? 'Every recipe' : 'Your kitchen',
      brandH2: signup ? 'worth keeping.' : 'is waiting.',
      brandCopy: signup
        ? 'Make a free account to save recipes from any YouTube video and build a cookbook that cooks the way you do.'
        : 'Sign back in to pick up your feed, your saved recipes, and your collections — right where you left them.',
      perks: signup
        ? ['Save recipes from any video', 'Steps linked to the exact moment', 'Collections, organised your way']
        : ['Your saved recipes, synced', 'Pick up mid-recipe, any device', 'Your taste, already tuned'],

      heading: signup ? 'Create your account' : 'Sign in',
      subhead: signup ? 'Free forever — no card needed.' : 'Good to see you back in the kitchen.',
      dividerLabel: signup ? 'OR SIGN UP WITH EMAIL' : 'OR SIGN IN WITH EMAIL',

      email,
      emailBorder: emailError ? accent : 'var(--line-2)',
      emailError,
      onEmail: (e) => this.setState({ email: e.target.value }),

      password,
      pwType: showPw ? 'text' : 'password',
      pwAutocomplete: signup ? 'new-password' : 'current-password',
      pwPlaceholder: signup ? 'Create a password' : 'Your password',
      pwBorder: pwTooShort ? accent : 'var(--line-2)',
      pwToggleLabel: showPw ? 'HIDE' : 'SHOW',
      togglePw: () => this.setState((s) => ({ showPw: !s.showPw })),
      onPassword: (e) => this.setState({ password: e.target.value }),
      pwHint: signup ? (pwTooShort ? 'Use at least 8 characters.' : 'At least 8 characters.') : '',
      pwHintColor: pwTooShort ? accent : 'var(--muted)',
      forgotLabel: signup ? '' : 'Forgot password?',

      onKey: (e) => { if (e.key === 'Enter') submit(); },
      onSubmit: submit,
      loading,
      submitDisabled: !canSubmit,
      submitLabel: loading ? (signup ? 'Creating account…' : 'Signing in…') : (signup ? 'Create account' : 'Sign in'),
      submitBg: canSubmit ? 'var(--accent)' : 'var(--surface-2)',
      submitColor: canSubmit ? 'var(--on-accent)' : 'var(--muted)',
      submitShadow: canSubmit ? 'var(--shadow-1)' : 'none',
      submitCursor: canSubmit ? 'pointer' : 'not-allowed',

      legalCopy: signup ? 'By creating an account you agree to our Terms and Privacy Policy.' : '',

      switchPrompt: signup ? 'Already have an account?' : 'New to Mise?',
      switchAction: signup ? 'Sign in' : 'Create an account',
      switchMode: () => setMode(signup ? 'signin' : 'signup'),

      noop: () => {},
    };
  }
}
</script>
</body>
</html>
