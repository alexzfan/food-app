services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe}
      POSTGRES_DB: recipe
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # GPU is strongly recommended for a 26B model. If you have the NVIDIA
    # Container Toolkit installed, uncomment to pass GPUs through:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: waits for ollama, pulls the model, then exits. The model is
  # cached in the ollama-data volume, so this is a no-op on later starts.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done
        ollama pull ${GEMMA_MODEL:-gemma4:26b-a4b-it-qat}
    restart: "no"

  ml:
    build: ./apps/audio-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      EXTRACTOR_BACKEND: ${EXTRACTOR_BACKEND:-local}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:26b-a4b-it-qat}
      LLAMACPP_URL: ${LLAMACPP_URL:-http://llamacpp:8080/v1/chat/completions}
      HOSTED_LLM_URL: ${HOSTED_LLM_URL:-}
      HOSTED_LLM_API_KEY: ${HOSTED_LLM_API_KEY:-}
      HOSTED_LLM_MODEL: ${HOSTED_LLM_MODEL:-}
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "${ML_PORT:-8001}:8001"

  # GPU path (opt-in): llama.cpp server running the 26B-A4B MoE with expert
  # offload -- attention/shared weights on GPU, sparse experts in system RAM.
  # Enable with: EXTRACTOR_BACKEND=llamacpp docker compose --profile gpu up
  # Uses the unsloth GGUF directly (loads fine in llama.cpp; only Ollama's pull
  # 400s on it). Needs the NVIDIA Container Toolkit.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles: ["gpu"]
    restart: unless-stopped
    environment:
      LLAMA_CACHE: /cache
    volumes:
      - llamacpp-data:/cache
    # LLAMACPP_NCMOE = how many layers' MoE experts to keep in CPU RAM.
    #   99  -> all experts in RAM (GPU-poor + lots of RAM; needs ~32GB RAM)
    #   0   -> fully GPU-resident (when the quant ~fits VRAM)
    #   8-16-> partial: fits a ~16GB GPU + modest RAM, leaves VRAM for KV cache
    command:
      - "-hf"
      - "${LLAMACPP_HF_MODEL:-unsloth/gemma-4-26B-A4B-it-qat-GGUF:Q4_K_XL}"
      - "-ngl"
      - "99"
      - "--n-cpu-moe"
      - "${LLAMACPP_NCMOE:-99}"
      - "-c"
      - "${LLAMACPP_CTX:-8192}"
      - "--jinja"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "${LLAMACPP_PORT:-8080}:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    build: ./apps/web
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  upload-data:
  ollama-data:
  llamacpp-data:
