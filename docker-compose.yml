services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe}
      POSTGRES_DB: recipe
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # GPU is strongly recommended for a 26B model. If you have the NVIDIA
    # Container Toolkit installed, uncomment to pass GPUs through:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # One-shot: waits for ollama, pulls the model, then exits. The model is
  # cached in the ollama-data volume, so this is a no-op on later starts.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do echo "waiting for ollama..."; sleep 2; done
        ollama pull ${GEMMA_MODEL:-gemma4:26b-a4b-it-qat}
    restart: "no"

  ml:
    build: ./apps/audio-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      EXTRACTOR_BACKEND: ${EXTRACTOR_BACKEND:-local}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-gemma4:26b-a4b-it-qat}
      HOSTED_LLM_URL: ${HOSTED_LLM_URL:-}
      HOSTED_LLM_API_KEY: ${HOSTED_LLM_API_KEY:-}
      HOSTED_LLM_MODEL: ${HOSTED_LLM_MODEL:-}
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "${ML_PORT:-8001}:8001"

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    build: ./apps/web
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  upload-data:
  ollama-data:
