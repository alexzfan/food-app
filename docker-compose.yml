services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: recipe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recipe}
      POSTGRES_DB: recipe
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recipe"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7
    restart: unless-stopped

  ml:
    build: ./apps/audio-service
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE:-base}
      MAX_DURATION_SECONDS: ${MAX_DURATION_SECONDS:-900}
      EXTRACTOR_BACKEND: ${EXTRACTOR_BACKEND:-local}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      GEMMA_MODEL: ${GEMMA_MODEL:-hf.co/unsloth/gemma-4-26B-A4B-it-qat-GGUF:Q4_K_XL}
      HOSTED_LLM_URL: ${HOSTED_LLM_URL:-}
      HOSTED_LLM_API_KEY: ${HOSTED_LLM_API_KEY:-}
      HOSTED_LLM_MODEL: ${HOSTED_LLM_MODEL:-}
    ports:
      - "${ML_PORT:-8001}:8001"

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-key-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "${WEB_PORT:-8000}:8000"

  worker:
    build: ./apps/web
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      DATABASE_URL: postgres://recipe:${POSTGRES_PASSWORD:-recipe}@db:5432/recipe
      REDIS_URL: redis://redis:6379/0
      ML_SERVICE_URL: http://ml:8001
      UPLOAD_DIR: /uploads
    volumes:
      - upload-data:/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  db-data:
  upload-data:
