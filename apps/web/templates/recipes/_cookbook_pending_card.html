<div class="rcard rcard--pending" id="job-{{ job.id }}"{% if not failed %} hx-get="{% url 'cookbook_job_card' job.id %}?view=grid" hx-trigger="load delay:1800ms" hx-swap="outerHTML"{% endif %}>
  <div class="rthumb">
    {% if job.thumbnail_url %}<img src="{{ job.thumbnail_url }}" alt="" loading="lazy" style="opacity:.55;">{% endif %}
    {% if failed %}<span class="play" style="z-index:1;"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></span>{% else %}<span class="pending-spin" role="status" aria-label="Extracting recipe" style="position:relative; z-index:1;"></span>{% endif %}
  </div>
  <div style="padding:15px 16px 17px;">
    <div class="ceyebrow">{% if failed %}EXTRACTION FAILED{% else %}EXTRACTING…{% endif %}</div>
    <h4 class="rtitle">{{ job.title|default:"Untitled recipe" }}</h4>
    {% if failed %}<div class="credit"><span class="cn" style="color:var(--ink-2);">{{ job.error|default:"Something went wrong" }}</span></div>{% endif %}
  </div>
</div>
