{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<h1>Profile</h1>
<p>Email: {{ user.email }}</p>
<form method="post">{% csrf_token %}
  <label>Display name <input name="display_name" value="{{ user.display_name }}"></label>
  <button type="submit">Save</button>
</form>
{% endblock %}
